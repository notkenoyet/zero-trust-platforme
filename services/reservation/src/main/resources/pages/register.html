<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Créer un compte</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Réservation de salles</h1>
    <h2>Créer un compte</h2>
    <form id="register-form">
      <label>Prénom
        <input id="first" required maxlength="60" autocomplete="given-name">
      </label>
      <label>Nom
        <input id="last" required maxlength="60" autocomplete="family-name">
      </label>
      <label>E-mail
        <input id="email" type="email" required maxlength="200" autocomplete="email">
      </label>
      <label>Identifiant (3 à 30 caractères : lettres, chiffres, . _ -)
        <input id="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_.\-]{3,30}" autocomplete="username">
      </label>
      <label>Mot de passe (10 caractères minimum)
        <input id="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password">
      </label>
      <button type="submit">Créer mon compte</button>
      <p id="error" class="error" role="alert"></p>
    </form>
    <p>Déjà un compte ? <a href="/app/login">Se connecter</a></p>
  </main>
  <script src="/static/register.js"></script>
</body>
</html>
