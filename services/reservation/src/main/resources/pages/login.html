<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Réservation de salles</h1>
    <h2>Connexion</h2>
    <form id="login-form">
      <label>Identifiant
        <input id="username" required maxlength="100" autocomplete="username">
      </label>
      <label>Mot de passe
        <input id="password" type="password" required maxlength="200" autocomplete="current-password">
      </label>
      <button type="submit">Se connecter</button>
      <p id="info" class="info" role="status"></p>
      <p id="error" class="error" role="alert"></p>
    </form>
    <p>Pas de compte ? <a href="/app/register">Créer un compte</a></p>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
